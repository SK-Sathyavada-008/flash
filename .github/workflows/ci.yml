name: Flash CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-agent:
    name: Windows Desktop Agent Tests
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Agent Dependencies
        run: |
          cd flash/agent
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        env:
          FLASH_DEBUG: "true"
          FLASH_STORAGE_BASE_DIR: "C:\\tmp\\flash_test_storage"
        run: |
          cd flash/agent
          pytest -v --tb=short

  test-companion:
    name: Companion Web App Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: flash/companion/package.json

      - name: Install Companion Dependencies
        run: |
          cd flash/companion
          npm install

      - name: Build Companion App
        run: |
          cd flash/companion
          npm run build

  test-cloud:
    name: Cloud Coordinator Service Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Cloud Requirements
        run: |
          cd flash/cloud
          python -m pip install -r requirements.txt
          python -c "import main; print('Cloud Coordinator syntax and imports OK')"
