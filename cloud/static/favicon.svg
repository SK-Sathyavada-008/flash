<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="#1e293b"/>
  <!-- Sloth head -->
  <circle cx="50" cy="50" r="32" fill="#d97706"/>
  <!-- Mask around eyes -->
  <path d="M 28 48 C 28 38 42 38 48 46 C 54 38 68 38 68 48 C 68 58 54 58 48 50 C 42 58 28 58 28 48 Z" fill="#92400e"/>
  <!-- Cheeks / Muzzle -->
  <ellipse cx="50" cy="58" rx="14" ry="10" fill="#fef3c7"/>
  <!-- Eyes -->
  <circle cx="38" cy="48" r="4.5" fill="#0f172a"/>
  <circle cx="62" cy="48" r="4.5" fill="#0f172a"/>
  <circle cx="39.5" cy="46.5" r="1.5" fill="#ffffff"/>
  <circle cx="63.5" cy="46.5" r="1.5" fill="#ffffff"/>
  <!-- Nose -->
  <ellipse cx="50" cy="55" rx="3.5" ry="2.5" fill="#451a03"/>
  <!-- Sloth Smile -->
  <path d="M 46 60 Q 50 63 54 60" stroke="#451a03" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
